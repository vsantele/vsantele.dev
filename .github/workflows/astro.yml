# Workflow for building and deploying an Astro site to VPS
name: Deploy Astro site to VPS

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Astro
        run: npm run build
      
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build result for job build
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist
      
      - name: deploy-via-scp
        uses: horochx/deploy-via-scp@1.1.0
        with:
          # Local file path
          local: dist/*
          # Remote file path
          remote: /var/www/vsantele.dev/
          # Remote server address
          host: ${{ secrets.HOST }}
          # Remote server port
          port: ${{ secrets.PORT }}
          # Remote server user
          user: ${{ secrets.USERNAME }}
          # Remote server private key
          key: ${{ secrets.SSHKEY }}
          # Ensure the existance of the remote file path
          ensureRemote: true
