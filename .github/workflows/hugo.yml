# Sample workflow for building and deploying a Hugo site to VPS
name: Deploy Hugo site to VPS

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install deps
        run: |
          hugo mod get &&
          npm install --omit=dev
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: public

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build result for job build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: public
      - name: load priv key
        run: |
          mkdir $HOME/.ssh/
          touch $HOME/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.HOST }}" > $HOME/.ssh/known_hosts
          echo "${{ secrets.SSHKEY }}" > $HOME/.ssh/id_ed25519
          chmod 400 $HOME/.ssh/id_ed25519
      - name: upload to vps
        run: scp -i $HOME/.ssh/id_ed25519 -r public/* -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/vsantele.dev/
