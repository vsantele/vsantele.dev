{{- if isset .Site.Params "atproto" -}}
  <style>
    :root {
      .colorscheme-dark {
        --sequoia-border-radius: 12px;
        --sequoia-bg-color: #212121;
        --sequoia-fg-color: #F5F3EF;
        --sequoia-border-color: #333;
        --sequoia-secondary-color: #8B7355;
      }
    }
  </style>
  <sequoia-subscribe ></sequoia-subscribe>
  {{ if hugo.IsServer }}
    {{ $script := resources.Get "js/sequoia-subscribe.js" }}
    <script type="module" src="{{ $script.RelPermalink }}"></script>
  {{ else }}
    {{ $script := resources.Get "js/sequoia-subscribe.js" | resources.Minify | resources.Fingerprint }}
    <script type="module" src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>
  {{ end }}
{{- end -}}
