baseURL: "https://vsantele.dev/"
locale: "fr-BE"
title: "Victor Santelé"
theme: "hugo-coder"
defaultcontentlanguage: "fr"

pagination:
  pagerSize: 20

pygmentsstyle: "bw"
pygmentscodefences: true
pygmentscodefencesguesssyntax: true

languages:
  fr:
    disabled: false
    locale: fr-BE
    direction: ltr
    label: Français
    weight: 1
    params:
      info: "AI & Data Developer chez Sparkle.tech"
      description: "Site personnel de Victor Santelé regroupant projets et articles"
      keywords: "belge,blog,projets,personnel,développeur,data,ai,cloud,infrastructure"
  en:
    disabled: false
    locale: en-US
    direction: ltr
    label: English
    weight: 2
    params:
      info: "AI & Data Developer at Sparkle.tech"
      description: "Personal website of Victor Santelé with projects and articles"
      keywords: "belgian,blog,projects,personal,developer,data,ai,cloud,infrastructure"

params:
  author: Victor Santelé
  info: "AI & Data Developer chez Sparkle.tech"
  description: "Site personnel de Victor Santelé regroupant projets et articles"
  keywords: "belge,blog,projets,personnel,développeur,data,ai,cloud,infrastructure"
  avatarUrl: "/img/misc/profile.webp"

  favicon_32: "/img/logo/logo32.png"
  favicon_16: "/img/logo/logo16.png"
  faviconSVG: "/img/logo/logo.svg"

  customCSS: ["css/json_resume_override.css"]

  since: 2022

  enableTwemoji: true

  colorScheme: auto
  hidecolorsschemetoggle: false

  social:
    - name: Github
      icon: fa fa-github fa-2x
      weight: 1
      url: "https://github.com/vsantele"
    - name: Twitter
      icon: fa fa-brands fa-x-twitter fa-2x
      weight: 2
      url: "https://twitter.com/vsantele"
    - name: "LinkedIn"
      icon: fa fa-linkedin fa-2x
      weight: 3
      url: "https://www.linkedin.com/in/victor-santele/"
    - name: "Bluesky"
      icon: fa fa-brands fa-bluesky fa-2x
      weight: 4
      url: "https://bsky.app/profile/vsantele.dev"

  plausibleAnalytics:
    domain: "vsantele.dev"
    serverURL: "stats.vsantele.dev"
  atproto: {}

taxonomies:
  category: categories
  tag: tags
  author: authors
  series: series

permalinks:
  posts: /posts/:year/:month/:title/
  projets: /projets/:year/:month/:title/

module:
  imports:
    - path: "github.com/schnerring/hugo-mod-json-resume"
  mounts:
    - source: "node_modules/simple-icons/icons"
      target: "assets/simple-icons"
    - source: content
      target: content
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: data
      target: data
    - source: assets
      target: assets
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes

markup:
  highlight:
    style: github-dark
